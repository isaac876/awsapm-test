name: AWS APM Test
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  awsapm:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/application-observability-for-aws@v1
        with:
          allowed_non_write_users: '*'
          bot_name: '@awsapm'
